apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.8.32-change-management
  name: iso27001-a-8-32-change-management
  title: Changes are subject to change management procedures
  framework: iso27001
  category: Technological Controls
  severity: high
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.8.32 requires changes to information processing facilities and systems to be subject to change management procedures. Concord verifies a cosigned attestation of the change process, the approval gates, and the rollback procedure.

  rationale: |
    Unmanaged changes are a top cause of both outages and security regressions; change control is the guardrail.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-8-32-change-management-pass.json
      params:
        kind: change_management

  policy:
    engine: rego
    package: concord.iso27001.a_8_32_change_management
    file: ../policies/iso27001-a-8-32-change-management.rego

  remediation:
    runbook: docs/remediation/iso27001-a-8-32-change-management.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.8.32"
    nist_800_53:
      - "CM-3"

  status: stable
  blocking: true
