apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.5.8-information-security-in-project-management
  name: iso27001-a-5-8-information-security-in-project-management
  title: Information security is integrated into project management
  framework: iso27001
  category: Organisational Controls
  severity: medium
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.5.8 requires information security to be integrated into project management. Concord verifies a cosigned attestation of the per-project risk assessment, the security gates, and how security is integrated across the project lifecycle.

  rationale: |
    Security bolted on after delivery is costlier and weaker; A.5.8 ensures risks are addressed at project inception.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-5-8-information-security-in-project-management-pass.json
      params:
        kind: project_security

  policy:
    engine: rego
    package: concord.iso27001.a_5_8_information_security_in_project_management
    file: ../policies/iso27001-a-5-8-information-security-in-project-management.rego

  remediation:
    runbook: docs/remediation/iso27001-a-5-8-information-security-in-project-management.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.5.8"
    nist_800_53:
      - "SA-3"
      - "PL-2"

  status: stable
  blocking: true
