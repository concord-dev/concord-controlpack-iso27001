apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.8.1-user-endpoint-devices
  name: iso27001-a-8-1-user-endpoint-devices
  title: User endpoint devices are inventoried and managed via MDM
  framework: iso27001
  category: Technological Controls
  severity: high
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.8.1 requires information on user endpoint devices to be
    protected. Concord verifies this technically by reading the managed-device
    inventory from the identity/MDM provider and confirming every endpoint is
    MDM-enrolled and full-disk encrypted. Fail-closed: an endpoint missing either
    control is flagged individually.

  rationale: |
    Unmanaged, unencrypted endpoints are a leading cause of PII/data loss; MDM
    enrollment and full-disk encryption are the baseline endpoint controls. A
    self-attestation cannot show the current device fleet actually meets them —
    the live inventory can.

  evidence:
    - id: managed_devices
      source: okta
      type: device_inventory
      fixture: ../tests/fixtures/iso27001-a-8-1-user-endpoint-devices-pass.json

  policy:
    engine: rego
    package: concord.iso27001.a_8_1_user_endpoint_devices
    file: ../policies/iso27001-a-8-1-user-endpoint-devices.rego

  remediation:
    runbook: docs/remediation/iso27001-a-8-1-user-endpoint-devices.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.8.1"
    nist_800_53:
      - "CM-8"
      - "AC-19"

  status: stable
  blocking: true
