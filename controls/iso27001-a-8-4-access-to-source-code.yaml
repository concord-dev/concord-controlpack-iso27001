apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.8.4-access-to-source-code
  name: iso27001-a-8-4-access-to-source-code
  title: Access to source code is restricted to authorised personnel
  framework: iso27001
  category: Technological Controls
  severity: medium
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.8.4 requires read and write access to source code, development tools, and libraries to be appropriately managed. Concord verifies a cosigned attestation of the access restrictions, the repository controls (branch protection, reviews), and the access-review process.

  rationale: |
    Unrestricted source access enables backdoors and IP theft; repository access control is the control point.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-8-4-access-to-source-code-pass.json
      params:
        kind: source_code_access

  policy:
    engine: rego
    package: concord.iso27001.a_8_4_access_to_source_code
    file: ../policies/iso27001-a-8-4-access-to-source-code.rego

  remediation:
    runbook: docs/remediation/iso27001-a-8-4-access-to-source-code.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.8.4"
    nist_800_53:
      - "AC-3"
      - "CM-5"

  status: stable
  blocking: true
