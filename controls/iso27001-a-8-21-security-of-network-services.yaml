apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.8.21-security-of-network-services
  name: iso27001-a-8-21-security-of-network-services
  title: Network services are identified, monitored, and protected
  framework: iso27001
  category: Technological Controls
  severity: high
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.8.21 requires security mechanisms, service levels, and
    requirements of network services to be identified, implemented, and
    monitored. Concord verifies this technically over the security-group
    inventory: no group may expose a sensitive administrative or database
    service port (SSH, RDP, MySQL, Postgres, Redis, Elasticsearch, Mongo) to the
    entire internet (0.0.0.0/0). Fail-closed: no evidence is a denial.

  rationale: |
    An unrestricted network service is the most common initial-access vector.
    Reading the live security-group rules proves exposure is actually
    controlled, not merely documented.

  evidence:
    - id: security_groups
      source: aws
      type: security_groups
      fixture: ../tests/fixtures/iso27001-a-8-21-security-of-network-services-pass.json

  policy:
    engine: rego
    package: concord.iso27001.a_8_21_security_of_network_services
    file: ../policies/iso27001-a-8-21-security-of-network-services.rego

  remediation:
    runbook: docs/remediation/iso27001-a-8-21-security-of-network-services.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.8.21"
    nist_800_53:
      - "SC-7"
      - "CA-3"

  status: stable
  blocking: true
