apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.6.1-screening
  name: iso27001-a-6-1-screening
  title: Background screening is done on candidates per legal requirements
  framework: iso27001
  category: People Controls
  severity: medium
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.6.1 requires background verification checks on candidates proportional to business requirements and risk. Concord verifies a cosigned attestation of the screening process, the roles in scope, and legal compliance of the screening.

  rationale: |
    Pre-employment screening is a primary insider-threat control and a common A.6.1 audit finding when undocumented.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-6-1-screening-pass.json
      params:
        kind: background_screening

  policy:
    engine: rego
    package: concord.iso27001.a_6_1_screening
    file: ../policies/iso27001-a-6-1-screening.rego

  remediation:
    runbook: docs/remediation/iso27001-a-6-1-screening.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.6.1"
    nist_800_53:
      - "PS-3"

  status: stable
  blocking: true
