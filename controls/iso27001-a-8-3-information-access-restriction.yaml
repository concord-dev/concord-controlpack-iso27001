apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.8.3-information-access-restriction
  name: iso27001-a-8-3-information-access-restriction
  title: Access to information is restricted per the access control policy
  framework: iso27001
  category: Technological Controls
  severity: high
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.8.3 requires access to information and other associated assets to be restricted per the access control policy. Concord verifies a cosigned attestation of the access control policy, the enforcing mechanisms, and the access-review process.

  rationale: |
    Least-privilege access restriction is the core preventive control against both external compromise and insider misuse.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-8-3-information-access-restriction-pass.json
      params:
        kind: access_restriction

  policy:
    engine: rego
    package: concord.iso27001.a_8_3_information_access_restriction
    file: ../policies/iso27001-a-8-3-information-access-restriction.rego

  remediation:
    runbook: docs/remediation/iso27001-a-8-3-information-access-restriction.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.8.3"
    nist_800_53:
      - "AC-3"
      - "AC-6"

  status: stable
  blocking: true
