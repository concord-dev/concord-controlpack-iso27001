apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.5.12-classification-of-information
  name: iso27001-a-5-12-classification-of-information
  title: Information is classified according to legal, business, and security needs
  framework: iso27001
  category: Organisational Controls
  severity: high
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.5.12 requires information to be classified per confidentiality, integrity, availability, and legal requirements. Concord verifies a cosigned attestation of the classification scheme, the classification criteria, and the per-level handling rules.

  rationale: |
    Classification drives every downstream protection decision; an absent or unapplied scheme collapses data-handling controls.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-5-12-classification-of-information-pass.json
      params:
        kind: information_classification

  policy:
    engine: rego
    package: concord.iso27001.a_5_12_classification_of_information
    file: ../policies/iso27001-a-5-12-classification-of-information.rego

  remediation:
    runbook: docs/remediation/iso27001-a-5-12-classification-of-information.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.5.12"
    nist_800_53:
      - "RA-2"
      - "MP-3"

  status: stable
  blocking: true
