apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.5.34-privacy-and-pii
  name: iso27001-a-5-34-privacy-and-pii
  title: Privacy and protection of PII is ensured per regulations
  framework: iso27001
  category: Organisational Controls
  severity: high
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.5.34 requires identifying and meeting requirements for privacy and protection of PII. Concord verifies a cosigned attestation of the PII inventory, the legal basis for processing, and the data-subject-rights process.

  rationale: |
    PII mishandling triggers GDPR/CCPA penalties and breach notification; A.5.34 is the privacy anchor control.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-5-34-privacy-and-pii-pass.json
      params:
        kind: privacy_pii

  policy:
    engine: rego
    package: concord.iso27001.a_5_34_privacy_and_pii
    file: ../policies/iso27001-a-5-34-privacy-and-pii.rego

  remediation:
    runbook: docs/remediation/iso27001-a-5-34-privacy-and-pii.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.5.34"
    nist_800_53:
      - "PT-1"
      - "PT-3"

  status: stable
  blocking: true
