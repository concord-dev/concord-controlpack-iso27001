apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.6.7-remote-working
  name: iso27001-a-6-7-remote-working
  title: Remote working security is enforced via policy and controls
  framework: iso27001
  category: People Controls
  severity: high
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.6.7 requires security measures for personnel working remotely. Concord verifies a cosigned attestation of the remote-access controls, the device requirements, and the remote acceptable-use rules.

  rationale: |
    Remote work expands the attack surface beyond the corporate perimeter; A.6.7 is the control that re-establishes it.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-6-7-remote-working-pass.json
      params:
        kind: remote_working_security

  policy:
    engine: rego
    package: concord.iso27001.a_6_7_remote_working
    file: ../policies/iso27001-a-6-7-remote-working.rego

  remediation:
    runbook: docs/remediation/iso27001-a-6-7-remote-working.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.6.7"
    nist_800_53:
      - "AC-17"

  status: stable
  blocking: true
