apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.8.17-clock-synchronisation
  name: iso27001-a-8-17-clock-synchronisation
  title: System clocks are synchronised to an approved reference time source
  framework: iso27001
  category: Technological Controls
  severity: low
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.8.17 requires clocks of information processing systems to be synchronised to approved time sources. Concord verifies a cosigned attestation of the reference time source, the synchronisation protocol, and coverage across systems.

  rationale: |
    Unsynchronised clocks make log correlation and forensic timelines unreliable across systems.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-8-17-clock-synchronisation-pass.json
      params:
        kind: clock_synchronisation

  policy:
    engine: rego
    package: concord.iso27001.a_8_17_clock_synchronisation
    file: ../policies/iso27001-a-8-17-clock-synchronisation.rego

  remediation:
    runbook: docs/remediation/iso27001-a-8-17-clock-synchronisation.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.8.17"
    nist_800_53:
      - "AU-8"

  status: stable
  blocking: true
