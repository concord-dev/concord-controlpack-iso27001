apiVersion: concord.dev/v1
kind: Control
metadata:
  id: ISO27001-A.8.5-secure-authentication
  name: secure-authentication-strong-mfa
  title: Every active identity-provider user is enrolled in a phishing-resistant MFA factor
  framework: iso27001
  category: Technological Controls
  severity: critical
  tags: [iso27001, mfa, identity]
  owners:
    - team: it-security
spec:
  description: |
    ISO/IEC 27001:2022 A.8.5 requires secure authentication technologies
    appropriate for the risk. Concord queries the IdP and verifies every
    ACTIVE user has at least one strong MFA factor (TOTP, push, WebAuthn,
    or hardware token).
  rationale: |
    SMS and voice MFA are well-documented as bypassable. ISO 27001 audits
    increasingly expect phishing-resistant factors, especially after
    SIM-swap-driven breaches in 2023-2025.
  evidence:
    - id: okta_users
      source: okta
      type: users_mfa
      fixture: ../tests/fixtures/A.8.5-pass.json
      params:
        org_url: ${env.OKTA_ORG_URL}
  policy:
    engine: rego
    package: concord.iso27001.a_8_5
    file: ../policies/a_8_5.rego
  remediation:
    runbook: docs/remediation/iso27001-A.8.5.md
    auto_fix: false
    estimated_effort: 1d
  mappings:
    iso27001: ["A.8.5"]
    soc2: ["CC6.1"]
    nist_csf: ["PR.AA-03"]
    hipaa: ["164.308(a)(5)(ii)(C)"]
    cis_controls: ["6.3", "6.4"]
  status: stable
  blocking: true
