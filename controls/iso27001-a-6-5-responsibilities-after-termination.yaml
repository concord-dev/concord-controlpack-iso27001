apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.6.5-responsibilities-after-termination
  name: iso27001-a-6-5-responsibilities-after-termination
  title: Responsibilities remaining after termination are defined
  framework: iso27001
  category: People Controls
  severity: medium
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.6.5 requires information security responsibilities that remain valid after termination to be defined, enforced, and communicated. Concord verifies a cosigned attestation of the continuing obligations, their enforcement, and communication at exit.

  rationale: |
    Confidentiality and IP obligations that survive employment are only enforceable if defined and acknowledged at exit.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-6-5-responsibilities-after-termination-pass.json
      params:
        kind: post_termination_responsibilities

  policy:
    engine: rego
    package: concord.iso27001.a_6_5_responsibilities_after_termination
    file: ../policies/iso27001-a-6-5-responsibilities-after-termination.rego

  remediation:
    runbook: docs/remediation/iso27001-a-6-5-responsibilities-after-termination.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.6.5"
    nist_800_53:
      - "PS-4"
      - "PS-6"

  status: stable
  blocking: true
