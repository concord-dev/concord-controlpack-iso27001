apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.5.6-contact-with-special-interest-groups
  name: iso27001-a-5-6-contact-with-special-interest-groups
  title: Appropriate contacts with special interest groups are maintained
  framework: iso27001
  category: Organisational Controls
  severity: low
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.5.6 requires contact with special interest groups and professional security forums. Concord verifies a cosigned attestation of the groups engaged, the nature of participation, and how threat intel is shared internally.

  rationale: |
    Peer and forum contacts are a primary source of early threat intelligence and remediation guidance.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-5-6-contact-with-special-interest-groups-pass.json
      params:
        kind: special_interest_groups

  policy:
    engine: rego
    package: concord.iso27001.a_5_6_contact_with_special_interest_groups
    file: ../policies/iso27001-a-5-6-contact-with-special-interest-groups.rego

  remediation:
    runbook: docs/remediation/iso27001-a-5-6-contact-with-special-interest-groups.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.5.6"
    nist_800_53:
      - "PM-15"
      - "SI-5"

  status: stable
  blocking: true
