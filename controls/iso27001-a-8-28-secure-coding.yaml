apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.8.28-secure-coding
  name: iso27001-a-8-28-secure-coding
  title: Secure coding principles are applied during development
  framework: iso27001
  category: Technological Controls
  severity: high
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.8.28 requires secure coding principles to be applied to software development. Concord verifies a cosigned attestation of the coding standards, the SAST tooling, and developer secure-coding training.

  rationale: |
    Most application vulnerabilities originate in code; enforced secure-coding standards and SAST catch them early.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-8-28-secure-coding-pass.json
      params:
        kind: secure_coding

  policy:
    engine: rego
    package: concord.iso27001.a_8_28_secure_coding
    file: ../policies/iso27001-a-8-28-secure-coding.rego

  remediation:
    runbook: docs/remediation/iso27001-a-8-28-secure-coding.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.8.28"
    nist_800_53:
      - "SA-15"
      - "SA-11"

  status: stable
  blocking: true
