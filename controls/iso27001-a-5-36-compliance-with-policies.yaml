apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.5.36-compliance-with-policies
  name: iso27001-a-5-36-compliance-with-policies
  title: Compliance with information security policies is reviewed
  framework: iso27001
  category: Organisational Controls
  severity: medium
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.5.36 requires regular review of compliance with the information security policy, standards, and procedures. Concord verifies a cosigned attestation of the review process, its coverage, and how exceptions are tracked.

  rationale: |
    Policies that are never checked for compliance decay into shelfware; A.5.36 keeps them operative.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-5-36-compliance-with-policies-pass.json
      params:
        kind: policy_compliance_review

  policy:
    engine: rego
    package: concord.iso27001.a_5_36_compliance_with_policies
    file: ../policies/iso27001-a-5-36-compliance-with-policies.rego

  remediation:
    runbook: docs/remediation/iso27001-a-5-36-compliance-with-policies.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.5.36"
    nist_800_53:
      - "CA-2"
      - "PM-14"

  status: stable
  blocking: true
