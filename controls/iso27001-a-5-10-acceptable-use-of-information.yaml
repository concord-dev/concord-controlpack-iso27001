apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.5.10-acceptable-use-of-information
  name: iso27001-a-5-10-acceptable-use-of-information
  title: Acceptable use rules for information and assets are defined
  framework: iso27001
  category: Organisational Controls
  severity: medium
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.5.10 requires rules for acceptable use of information and associated assets. Concord verifies a cosigned attestation of the acceptable-use rules, prohibited activities, and how user acknowledgement is tracked.

  rationale: |
    A documented, acknowledged AUP is what makes disciplinary action for misuse enforceable and defensible.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-5-10-acceptable-use-of-information-pass.json
      params:
        kind: acceptable_use

  policy:
    engine: rego
    package: concord.iso27001.a_5_10_acceptable_use_of_information
    file: ../policies/iso27001-a-5-10-acceptable-use-of-information.rego

  remediation:
    runbook: docs/remediation/iso27001-a-5-10-acceptable-use-of-information.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.5.10"
    nist_800_53:
      - "PL-4"
      - "AC-20"

  status: stable
  blocking: true
