apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.8.18-use-of-privileged-utility-programs
  name: iso27001-a-8-18-use-of-privileged-utility-programs
  title: Privileged utility programs are restricted and tightly controlled
  framework: iso27001
  category: Technological Controls
  severity: high
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.8.18 requires the use of utility programs capable of overriding system and application controls to be restricted and tightly controlled. Concord verifies a cosigned attestation of the restricted utilities, the authorization process, and monitoring of their use.

  rationale: |
    Privileged utilities can bypass every application-layer control; restricting and logging them is essential.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-8-18-use-of-privileged-utility-programs-pass.json
      params:
        kind: privileged_utilities

  policy:
    engine: rego
    package: concord.iso27001.a_8_18_use_of_privileged_utility_programs
    file: ../policies/iso27001-a-8-18-use-of-privileged-utility-programs.rego

  remediation:
    runbook: docs/remediation/iso27001-a-8-18-use-of-privileged-utility-programs.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.8.18"
    nist_800_53:
      - "AC-6"
      - "CM-7"

  status: stable
  blocking: true
