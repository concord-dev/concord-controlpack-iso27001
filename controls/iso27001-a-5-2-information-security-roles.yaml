apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.5.2-information-security-roles
  name: iso27001-a-5-2-information-security-roles
  title: Information security roles and responsibilities are formally assigned
  framework: iso27001
  category: Organisational Controls
  severity: high
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.5.2 requires information security roles and responsibilities to be defined and allocated according to organizational needs. Concord verifies a cosigned attestation naming the defined roles, their responsibilities, and how authority is assigned, kept current by review.

  rationale: |
    Unassigned or ambiguous security roles are a common root cause of unremediated findings; auditors expect named, accountable owners.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-5-2-information-security-roles-pass.json
      params:
        kind: security_roles

  policy:
    engine: rego
    package: concord.iso27001.a_5_2_information_security_roles
    file: ../policies/iso27001-a-5-2-information-security-roles.rego

  remediation:
    runbook: docs/remediation/iso27001-a-5-2-information-security-roles.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.5.2"
    nist_800_53:
      - "PM-2"
      - "PS-9"

  status: stable
  blocking: true
