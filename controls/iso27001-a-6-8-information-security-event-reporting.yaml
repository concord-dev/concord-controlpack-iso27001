apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.6.8-information-security-event-reporting
  name: iso27001-a-6-8-information-security-event-reporting
  title: Reporting channel for information security events is documented
  framework: iso27001
  category: People Controls
  severity: medium
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.6.8 requires a mechanism for personnel to report observed or suspected information security events timely. Concord verifies a cosigned attestation of the reporting channel, the reporting timeframes, and how awareness of it is communicated.

  rationale: |
    Fast human reporting is often the earliest incident signal; a documented, known channel is what enables it.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-6-8-information-security-event-reporting-pass.json
      params:
        kind: event_reporting

  policy:
    engine: rego
    package: concord.iso27001.a_6_8_information_security_event_reporting
    file: ../policies/iso27001-a-6-8-information-security-event-reporting.rego

  remediation:
    runbook: docs/remediation/iso27001-a-6-8-information-security-event-reporting.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.6.8"
    nist_800_53:
      - "IR-6"

  status: stable
  blocking: true
