apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.8.9-configuration-management
  name: iso27001-a-8-9-configuration-management
  title: Configuration baselines exist and drift is detected
  framework: iso27001
  category: Technological Controls
  severity: high
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.8.9 requires configurations, including security
    configurations, to be established, documented, implemented, monitored, and
    reviewed. Concord verifies this technically via AWS Config: the configuration
    recorder must be enabled and recording in every active region, so resource
    configuration is continuously captured and drift is detectable. Fail-closed:
    no evidence, no active regions, or any non-recording region denies.

  rationale: |
    Configuration drift silently erodes hardening; continuous configuration
    recording keeps systems in a known-good, monitorable state. Reading the live
    Config recorder status proves monitoring is actually on, not merely policy.

  evidence:
    - id: config_recorders
      source: aws
      type: config_recorder_status
      fixture: ../tests/fixtures/iso27001-a-8-9-configuration-management-pass.json

  policy:
    engine: rego
    package: concord.iso27001.a_8_9_configuration_management
    file: ../policies/iso27001-a-8-9-configuration-management.rego

  remediation:
    runbook: docs/remediation/iso27001-a-8-9-configuration-management.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.8.9"
    nist_800_53:
      - "CM-2"
      - "CM-6"

  status: stable
  blocking: true
