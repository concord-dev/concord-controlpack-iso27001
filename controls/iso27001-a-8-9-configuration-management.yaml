apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.8.9-configuration-management
  name: iso27001-a-8-9-configuration-management
  title: Configuration baselines exist and drift is detected
  framework: iso27001
  category: Technological Controls
  severity: high
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.8.9 requires configurations, including security configurations, to be established, documented, implemented, monitored, and reviewed. Concord verifies a cosigned attestation of the baseline definitions, the drift-detection mechanism, and enforcement.

  rationale: |
    Configuration drift silently erodes hardening; baselines plus drift detection keep systems in a known-good state.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-8-9-configuration-management-pass.json
      params:
        kind: configuration_management

  policy:
    engine: rego
    package: concord.iso27001.a_8_9_configuration_management
    file: ../policies/iso27001-a-8-9-configuration-management.rego

  remediation:
    runbook: docs/remediation/iso27001-a-8-9-configuration-management.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.8.9"
    nist_800_53:
      - "CM-2"
      - "CM-6"

  status: stable
  blocking: true
