apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.5.20-information-security-in-supplier-agreements
  name: iso27001-a-5-20-information-security-in-supplier-agreements
  title: Information security requirements are agreed with each supplier
  framework: iso27001
  category: Organisational Controls
  severity: high
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.5.20 requires relevant information security requirements to be established and agreed with each supplier. Concord verifies a cosigned attestation of the security clauses, the coverage across the supplier base, and the review process.

  rationale: |
    Third parties are a top breach vector; contractual security requirements are the enforceable baseline for supplier risk.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-5-20-information-security-in-supplier-agreements-pass.json
      params:
        kind: supplier_agreements

  policy:
    engine: rego
    package: concord.iso27001.a_5_20_information_security_in_supplier_agreements
    file: ../policies/iso27001-a-5-20-information-security-in-supplier-agreements.rego

  remediation:
    runbook: docs/remediation/iso27001-a-5-20-information-security-in-supplier-agreements.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.5.20"
    nist_800_53:
      - "SR-2"
      - "SA-4"

  status: stable
  blocking: true
