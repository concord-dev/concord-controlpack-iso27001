apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.6.6-confidentiality-or-non-disclosure-agreements
  name: iso27001-a-6-6-confidentiality-or-non-disclosure-agreements
  title: Confidentiality / NDA agreements are signed where required
  framework: iso27001
  category: People Controls
  severity: medium
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.6.6 requires confidentiality or non-disclosure agreements reflecting the organization's information protection needs. Concord verifies a cosigned attestation of the NDA requirements, coverage across personnel and third parties, and the review process.

  rationale: |
    NDAs are the contractual backstop for confidential information shared with staff and partners.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-6-6-confidentiality-or-non-disclosure-agreements-pass.json
      params:
        kind: nda_management

  policy:
    engine: rego
    package: concord.iso27001.a_6_6_confidentiality_or_non_disclosure_agreements
    file: ../policies/iso27001-a-6-6-confidentiality-or-non-disclosure-agreements.rego

  remediation:
    runbook: docs/remediation/iso27001-a-6-6-confidentiality-or-non-disclosure-agreements.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.6.6"
    nist_800_53:
      - "PS-6"

  status: stable
  blocking: true
