apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.8.22-segregation-of-networks
  name: iso27001-a-8-22-segregation-of-networks
  title: Networks are segregated according to trust levels
  framework: iso27001
  category: Technological Controls
  severity: high
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.8.22 requires groups of information services, users, and
    systems to be segregated in the organization's networks. Concord verifies
    this technically over the network-ACL inventory: each ACL must carry an
    explicit deny-all catch-all on both directions, so traffic not expressly
    permitted is dropped and segments are isolated by default. Fail-closed: no
    evidence, no ACLs, or a missing deny-all denies.

  rationale: |
    Flat networks let one compromised host reach everything; segmentation
    contains lateral movement. Reading the live network ACLs proves the segment
    boundaries actually fail closed, not merely that a design document exists.

  evidence:
    - id: network_acls
      source: aws
      type: network_acls
      fixture: ../tests/fixtures/iso27001-a-8-22-segregation-of-networks-pass.json

  policy:
    engine: rego
    package: concord.iso27001.a_8_22_segregation_of_networks
    file: ../policies/iso27001-a-8-22-segregation-of-networks.rego

  remediation:
    runbook: docs/remediation/iso27001-a-8-22-segregation-of-networks.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.8.22"
    nist_800_53:
      - "SC-7"

  status: stable
  blocking: true
