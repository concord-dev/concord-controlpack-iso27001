apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.8.19-installation-of-software-on-operational-systems
  name: iso27001-a-8-19-installation-of-software-on-operational-systems
  title: Software installation on operational systems is controlled
  framework: iso27001
  category: Technological Controls
  severity: medium
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.8.19 requires procedures and measures to securely manage software installation on operational systems. Concord verifies a cosigned attestation of the installation policy, the approval process, and the enforcement mechanism.

  rationale: |
    Uncontrolled software installation introduces unvetted code and undermines the known-good baseline.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-8-19-installation-of-software-on-operational-systems-pass.json
      params:
        kind: software_installation_control

  policy:
    engine: rego
    package: concord.iso27001.a_8_19_installation_of_software_on_operational_systems
    file: ../policies/iso27001-a-8-19-installation-of-software-on-operational-systems.rego

  remediation:
    runbook: docs/remediation/iso27001-a-8-19-installation-of-software-on-operational-systems.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.8.19"
    nist_800_53:
      - "CM-11"
      - "CM-7"

  status: stable
  blocking: true
