apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.5.25-assessment-of-information-security-events
  name: iso27001-a-5-25-assessment-of-information-security-events
  title: Information security events are assessed and classified
  framework: iso27001
  category: Organisational Controls
  severity: medium
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.5.25 requires assessing information security events and deciding if they are incidents. Concord verifies a cosigned attestation of the assessment criteria, the event classification scheme, and the escalation thresholds.

  rationale: |
    Consistent triage criteria prevent both alert fatigue and missed incidents.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-5-25-assessment-of-information-security-events-pass.json
      params:
        kind: event_assessment

  policy:
    engine: rego
    package: concord.iso27001.a_5_25_assessment_of_information_security_events
    file: ../policies/iso27001-a-5-25-assessment-of-information-security-events.rego

  remediation:
    runbook: docs/remediation/iso27001-a-5-25-assessment-of-information-security-events.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.5.25"
    nist_800_53:
      - "IR-4"
      - "AU-6"

  status: stable
  blocking: true
