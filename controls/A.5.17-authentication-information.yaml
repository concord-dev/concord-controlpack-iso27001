apiVersion: concord.dev/v1
kind: Control
metadata:
  id: ISO27001-A.5.17-authentication-information
  name: authentication-information-strength
  title: IAM password policy meets ISO-equivalent strength requirements
  framework: iso27001
  category: Organisational Controls
  severity: high
  tags: [iso27001, identity, password]
  owners:
    - team: it-security
spec:
  description: |
    ISO/IEC 27001:2022 A.5.17 covers the allocation and management of
    authentication information. Concord verifies the AWS IAM password
    policy meets a 12-character minimum, mixed character classes,
    rotation ≤ 90 days, and reuse prevention ≥ 12.
  rationale: |
    NIST SP 800-63B Level 2 is the operational floor most ISO 27001
    auditors apply for cloud admin authentication. Defaults are weaker
    than the floor.
  evidence:
    - id: iam_password_policy
      source: aws
      type: iam_password_policy
      fixture: ../tests/fixtures/A.5.17-pass.json
      params:
        region: ${env.AWS_REGION}
  policy:
    engine: rego
    package: concord.iso27001.a_5_17
    file: ../policies/a_5_17.rego
  remediation:
    runbook: docs/remediation/iso27001-A.5.17.md
    auto_fix: true
    estimated_effort: 15m
  mappings:
    iso27001: ["A.5.17"]
    soc2: ["CC6.1"]
    nist_csf: ["PR.AA-01"]
    hipaa: ["164.308(a)(5)(ii)(D)"]
    cis_aws: ["1.8", "1.9"]
  status: stable
  blocking: true
