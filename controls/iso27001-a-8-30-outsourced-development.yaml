apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.8.30-outsourced-development
  name: iso27001-a-8-30-outsourced-development
  title: Outsourced development is supervised and monitored
  framework: iso27001
  category: Technological Controls
  severity: medium
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.8.30 requires the organization to direct, monitor, and review outsourced system development activities. Concord verifies a cosigned attestation of the supervision process, the security requirements imposed on the supplier, and monitoring.

  rationale: |
    Outsourced code inherits the vendor's security posture; supervision and requirements are how you govern that risk.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-8-30-outsourced-development-pass.json
      params:
        kind: outsourced_development

  policy:
    engine: rego
    package: concord.iso27001.a_8_30_outsourced_development
    file: ../policies/iso27001-a-8-30-outsourced-development.rego

  remediation:
    runbook: docs/remediation/iso27001-a-8-30-outsourced-development.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.8.30"
    nist_800_53:
      - "SA-4"
      - "SA-9"

  status: stable
  blocking: true
