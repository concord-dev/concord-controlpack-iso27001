apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.8.27-secure-system-architecture
  name: iso27001-a-8-27-secure-system-architecture
  title: Secure architecture principles are applied to system design
  framework: iso27001
  category: Technological Controls
  severity: medium
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.8.27 requires principles for engineering secure systems to be established, documented, and applied. Concord verifies a cosigned attestation of the architecture principles, the design review process, and the secure-patterns library.

  rationale: |
    Architectural flaws are the costliest to fix later; applying secure-design principles prevents whole vulnerability classes.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-8-27-secure-system-architecture-pass.json
      params:
        kind: secure_architecture

  policy:
    engine: rego
    package: concord.iso27001.a_8_27_secure_system_architecture
    file: ../policies/iso27001-a-8-27-secure-system-architecture.rego

  remediation:
    runbook: docs/remediation/iso27001-a-8-27-secure-system-architecture.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.8.27"
    nist_800_53:
      - "SA-8"
      - "PL-8"

  status: stable
  blocking: true
