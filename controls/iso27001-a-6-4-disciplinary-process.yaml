apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.6.4-disciplinary-process
  name: iso27001-a-6-4-disciplinary-process
  title: Formal disciplinary process for policy violations is documented
  framework: iso27001
  category: People Controls
  severity: medium
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.6.4 requires a formalized and communicated disciplinary process for information security policy violations. Concord verifies a cosigned attestation of the process steps, the violation categories, and how the process is communicated.

  rationale: |
    A consistent, communicated disciplinary process is what makes policy enforcement credible and deters violations.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-6-4-disciplinary-process-pass.json
      params:
        kind: disciplinary_process

  policy:
    engine: rego
    package: concord.iso27001.a_6_4_disciplinary_process
    file: ../policies/iso27001-a-6-4-disciplinary-process.rego

  remediation:
    runbook: docs/remediation/iso27001-a-6-4-disciplinary-process.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.6.4"
    nist_800_53:
      - "PS-8"

  status: stable
  blocking: true
