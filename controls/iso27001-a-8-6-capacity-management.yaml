apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.8.6-capacity-management
  name: iso27001-a-8-6-capacity-management
  title: Capacity demands are monitored and adjusted to needs
  framework: iso27001
  category: Technological Controls
  severity: low
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.8.6 requires the use of resources to be monitored and adjusted in line with current and expected capacity requirements. Concord verifies a cosigned attestation of the monitoring approach, the capacity thresholds, and the scaling process.

  rationale: |
    Capacity exhaustion is an availability risk that also degrades security controls (logging, monitoring) under load.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-8-6-capacity-management-pass.json
      params:
        kind: capacity_management

  policy:
    engine: rego
    package: concord.iso27001.a_8_6_capacity_management
    file: ../policies/iso27001-a-8-6-capacity-management.rego

  remediation:
    runbook: docs/remediation/iso27001-a-8-6-capacity-management.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.8.6"
    nist_800_53:
      - "SC-5"
      - "AU-4"

  status: stable
  blocking: true
