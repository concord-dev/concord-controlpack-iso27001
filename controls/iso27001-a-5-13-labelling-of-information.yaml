apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.5.13-labelling-of-information
  name: iso27001-a-5-13-labelling-of-information
  title: Information labelling is consistent with the classification scheme
  framework: iso27001
  category: Organisational Controls
  severity: medium
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.5.13 requires an appropriate set of procedures for information labelling. Concord verifies a cosigned attestation of the labelling procedure, the label types in use, and the tooling that applies them.

  rationale: |
    Labels are how classification is actually enforced by people and DLP tooling at the point of handling.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-5-13-labelling-of-information-pass.json
      params:
        kind: information_labelling

  policy:
    engine: rego
    package: concord.iso27001.a_5_13_labelling_of_information
    file: ../policies/iso27001-a-5-13-labelling-of-information.rego

  remediation:
    runbook: docs/remediation/iso27001-a-5-13-labelling-of-information.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.5.13"
    nist_800_53:
      - "MP-3"

  status: stable
  blocking: true
