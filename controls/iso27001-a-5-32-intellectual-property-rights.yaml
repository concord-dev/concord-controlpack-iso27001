apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.5.32-intellectual-property-rights
  name: iso27001-a-5-32-intellectual-property-rights
  title: Intellectual property rights are protected
  framework: iso27001
  category: Organisational Controls
  severity: low
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.5.32 requires appropriate procedures to protect intellectual property rights. Concord verifies a cosigned attestation of the IP protection measures, the software-license compliance process, and monitoring.

  rationale: |
    License non-compliance and IP misuse carry legal and financial liability that A.5.32 is designed to prevent.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-5-32-intellectual-property-rights-pass.json
      params:
        kind: ip_rights

  policy:
    engine: rego
    package: concord.iso27001.a_5_32_intellectual_property_rights
    file: ../policies/iso27001-a-5-32-intellectual-property-rights.rego

  remediation:
    runbook: docs/remediation/iso27001-a-5-32-intellectual-property-rights.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.5.32"
    nist_800_53:
      - "CM-10"

  status: stable
  blocking: true
