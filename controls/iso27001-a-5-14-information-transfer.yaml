apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.5.14-information-transfer
  name: iso27001-a-5-14-information-transfer
  title: Transfer of information is protected by transfer rules and agreements
  framework: iso27001
  category: Organisational Controls
  severity: high
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.5.14 requires rules, procedures, and agreements to protect information in transit across all transfer types. Concord verifies a cosigned attestation of the transfer rules, the transfer agreements, and the protection mechanisms (e.g. encryption) applied.

  rationale: |
    Information transfer (email, media, APIs, third parties) is a leading exfiltration and interception vector.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-5-14-information-transfer-pass.json
      params:
        kind: information_transfer

  policy:
    engine: rego
    package: concord.iso27001.a_5_14_information_transfer
    file: ../policies/iso27001-a-5-14-information-transfer.rego

  remediation:
    runbook: docs/remediation/iso27001-a-5-14-information-transfer.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.5.14"
    nist_800_53:
      - "AC-4"
      - "SC-8"

  status: stable
  blocking: true
