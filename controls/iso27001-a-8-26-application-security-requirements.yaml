apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.8.26-application-security-requirements
  name: iso27001-a-8-26-application-security-requirements
  title: Application security requirements are defined and tested
  framework: iso27001
  category: Technological Controls
  severity: high
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.8.26 requires information security requirements to be identified, specified, and approved when developing or acquiring applications. Concord verifies a cosigned attestation of the requirement categories, the definition process, and testing verification.

  rationale: |
    Undefined appsec requirements produce untestable, insecure software; explicit requirements are the contract.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-8-26-application-security-requirements-pass.json
      params:
        kind: appsec_requirements

  policy:
    engine: rego
    package: concord.iso27001.a_8_26_application_security_requirements
    file: ../policies/iso27001-a-8-26-application-security-requirements.rego

  remediation:
    runbook: docs/remediation/iso27001-a-8-26-application-security-requirements.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.8.26"
    nist_800_53:
      - "SA-8"
      - "SA-11"

  status: stable
  blocking: true
