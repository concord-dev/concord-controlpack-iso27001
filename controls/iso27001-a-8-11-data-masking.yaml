apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.8.11-data-masking
  name: iso27001-a-8-11-data-masking
  title: Data masking is applied when protecting sensitive information
  framework: iso27001
  category: Technological Controls
  severity: medium
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.8.11 requires data masking to be used in accordance with the access control and business requirements. Concord verifies a cosigned attestation of the masking techniques, the scope of application, and the tooling.

  rationale: |
    Masking limits exposure of sensitive fields to users and lower environments that do not need the clear values.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-8-11-data-masking-pass.json
      params:
        kind: data_masking

  policy:
    engine: rego
    package: concord.iso27001.a_8_11_data_masking
    file: ../policies/iso27001-a-8-11-data-masking.rego

  remediation:
    runbook: docs/remediation/iso27001-a-8-11-data-masking.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.8.11"
    nist_800_53:
      - "SC-28"
      - "AC-4"

  status: stable
  blocking: true
