apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.8.12-data-leakage-prevention
  name: iso27001-a-8-12-data-leakage-prevention
  title: DLP controls are deployed on systems handling sensitive information
  framework: iso27001
  category: Technological Controls
  severity: high
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.8.12 requires data leakage prevention measures on systems, networks, and devices that process, store, or transmit sensitive information. Concord verifies a cosigned attestation of the DLP controls, the monitored channels, and coverage.

  rationale: |
    DLP is the last-line detective/preventive control against both malicious and accidental exfiltration.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-8-12-data-leakage-prevention-pass.json
      params:
        kind: data_leakage_prevention

  policy:
    engine: rego
    package: concord.iso27001.a_8_12_data_leakage_prevention
    file: ../policies/iso27001-a-8-12-data-leakage-prevention.rego

  remediation:
    runbook: docs/remediation/iso27001-a-8-12-data-leakage-prevention.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.8.12"
    nist_800_53:
      - "SC-7"
      - "AC-4"

  status: stable
  blocking: true
