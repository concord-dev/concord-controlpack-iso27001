apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.8.23-web-filtering
  name: iso27001-a-8-23-web-filtering
  title: Web filtering limits access to malicious sites
  framework: iso27001
  category: Technological Controls
  severity: medium
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.8.23 requires access to external websites to be managed to reduce exposure to malicious content. Concord verifies a cosigned attestation of the web-filtering solution, the blocked categories, and coverage.

  rationale: |
    Web filtering blocks a common malware-delivery and phishing vector before it reaches the endpoint.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-8-23-web-filtering-pass.json
      params:
        kind: web_filtering

  policy:
    engine: rego
    package: concord.iso27001.a_8_23_web_filtering
    file: ../policies/iso27001-a-8-23-web-filtering.rego

  remediation:
    runbook: docs/remediation/iso27001-a-8-23-web-filtering.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.8.23"
    nist_800_53:
      - "SC-7"
      - "SI-3"

  status: stable
  blocking: true
