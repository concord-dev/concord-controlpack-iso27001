apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.5.31-legal-statutory-regulatory
  name: iso27001-a-5-31-legal-statutory-regulatory
  title: Legal, statutory, and regulatory requirements are identified and met
  framework: iso27001
  category: Organisational Controls
  severity: high
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.5.31 requires legal, statutory, regulatory, and contractual requirements to be identified, documented, and kept current. Concord verifies a cosigned attestation of the applicable requirements, the identification process, and compliance tracking.

  rationale: |
    Undiscovered legal/regulatory obligations are a direct source of fines and are a mandatory A.5.31 audit line.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-5-31-legal-statutory-regulatory-pass.json
      params:
        kind: legal_requirements

  policy:
    engine: rego
    package: concord.iso27001.a_5_31_legal_statutory_regulatory
    file: ../policies/iso27001-a-5-31-legal-statutory-regulatory.rego

  remediation:
    runbook: docs/remediation/iso27001-a-5-31-legal-statutory-regulatory.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.5.31"
    nist_800_53:
      - "PM-1"

  status: stable
  blocking: true
