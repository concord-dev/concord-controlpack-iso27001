apiVersion: concord.dev/v1
kind: Control
metadata:
  id: ISO27001-A.8.15-logging
  name: logging-retention-and-encryption
  title: Production log groups retain ≥ 1 year and are KMS-encrypted
  framework: iso27001
  category: Technological Controls
  severity: high
  tags: [iso27001, logging]
  owners:
    - team: security
spec:
  description: |
    ISO/IEC 27001:2022 A.8.15 requires logs of activities, exceptions,
    and information-security events to be produced, stored, protected,
    and analysed. Concord verifies CloudWatch Logs production groups
    have retention ≥ 365 days and are encrypted with a customer-managed
    KMS key.
  rationale: |
    ISO's floor on log retention varies by sector; 365 days is the
    minimum SecOps gets useful incident-investigation value from
    without paying for cold-storage archival.
  evidence:
    - id: cloudwatch_logs
      source: aws
      type: cloudwatch_log_groups
      fixture: ../tests/fixtures/A.8.15-pass.json
      params:
        region: ${env.AWS_REGION}
  policy:
    engine: rego
    package: concord.iso27001.a_8_15
    file: ../policies/a_8_15.rego
  remediation:
    runbook: docs/remediation/iso27001-A.8.15.md
    auto_fix: true
    estimated_effort: 1h
  mappings:
    iso27001: ["A.8.15"]
    soc2: ["CC7.2"]
    nist_csf: ["DE.AE-3"]
    nist_800_53: ["AU-11"]
    hipaa: ["164.312(b)"]
  status: stable
  blocking: true
