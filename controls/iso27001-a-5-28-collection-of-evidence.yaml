apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.5.28-collection-of-evidence
  name: iso27001-a-5-28-collection-of-evidence
  title: Evidence collection during incidents follows forensics procedures
  framework: iso27001
  category: Organisational Controls
  severity: medium
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.5.28 requires procedures for the identification, collection, and preservation of evidence. Concord verifies a cosigned attestation of the forensic procedures, the chain-of-custody controls, and the collection tooling.

  rationale: |
    Improperly collected evidence is inadmissible and can taint an entire investigation or legal action.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-5-28-collection-of-evidence-pass.json
      params:
        kind: evidence_collection

  policy:
    engine: rego
    package: concord.iso27001.a_5_28_collection_of_evidence
    file: ../policies/iso27001-a-5-28-collection-of-evidence.rego

  remediation:
    runbook: docs/remediation/iso27001-a-5-28-collection-of-evidence.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.5.28"
    nist_800_53:
      - "IR-4"
      - "AU-11"

  status: stable
  blocking: true
