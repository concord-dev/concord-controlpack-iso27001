apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.5.9-inventory-of-information-assets
  name: iso27001-a-5-9-inventory-of-information-assets
  title: Inventory of information assets is maintained and up to date
  framework: iso27001
  category: Organisational Controls
  severity: high
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.5.9 requires an inventory of information and other associated assets, including owners. Concord verifies a cosigned attestation of the inventory scope, owner assignment, and the review cadence keeping it current.

  rationale: |
    You cannot protect what you have not inventoried; the asset inventory underpins classification, access, and risk decisions.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-5-9-inventory-of-information-assets-pass.json
      params:
        kind: asset_inventory

  policy:
    engine: rego
    package: concord.iso27001.a_5_9_inventory_of_information_assets
    file: ../policies/iso27001-a-5-9-inventory-of-information-assets.rego

  remediation:
    runbook: docs/remediation/iso27001-a-5-9-inventory-of-information-assets.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.5.9"
    nist_800_53:
      - "CM-8"
      - "PM-5"

  status: stable
  blocking: true
