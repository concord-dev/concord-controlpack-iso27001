apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.5.22-monitoring-review-change-mgmt-supplier
  name: iso27001-a-5-22-monitoring-review-change-mgmt-supplier
  title: Suppliers are monitored, reviewed, and managed for compliance
  framework: iso27001
  category: Organisational Controls
  severity: medium
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.5.22 requires regular monitoring, review, and change management of supplier services. Concord verifies a cosigned attestation of the monitoring cadence, the review criteria, and how supplier changes are managed.

  rationale: |
    Supplier security drifts over time; periodic review catches degraded controls before they become incidents.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-5-22-monitoring-review-change-mgmt-supplier-pass.json
      params:
        kind: supplier_monitoring

  policy:
    engine: rego
    package: concord.iso27001.a_5_22_monitoring_review_change_mgmt_supplier
    file: ../policies/iso27001-a-5-22-monitoring-review-change-mgmt-supplier.rego

  remediation:
    runbook: docs/remediation/iso27001-a-5-22-monitoring-review-change-mgmt-supplier.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.5.22"
    nist_800_53:
      - "SR-6"
      - "SA-9"

  status: stable
  blocking: true
