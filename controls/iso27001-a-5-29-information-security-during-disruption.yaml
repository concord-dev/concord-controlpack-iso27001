apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.5.29-information-security-during-disruption
  name: iso27001-a-5-29-information-security-during-disruption
  title: Information security is maintained during business disruption
  framework: iso27001
  category: Organisational Controls
  severity: medium
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.5.29 requires information security to be maintained during disruption. Concord verifies a cosigned attestation of the continuity controls, the security posture in degraded mode, and the security-aware recovery priorities.

  rationale: |
    Disruptions are exactly when controls are most likely to be bypassed 'to restore service' — A.5.29 guards against that.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-5-29-information-security-during-disruption-pass.json
      params:
        kind: security_during_disruption

  policy:
    engine: rego
    package: concord.iso27001.a_5_29_information_security_during_disruption
    file: ../policies/iso27001-a-5-29-information-security-during-disruption.rego

  remediation:
    runbook: docs/remediation/iso27001-a-5-29-information-security-during-disruption.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.5.29"
    nist_800_53:
      - "CP-2"

  status: stable
  blocking: true
