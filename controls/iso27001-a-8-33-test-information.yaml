apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.8.33-test-information
  name: iso27001-a-8-33-test-information
  title: Test information is selected, protected, and managed
  framework: iso27001
  category: Technological Controls
  severity: medium
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.8.33 requires test information to be appropriately selected, protected, and managed. Concord verifies a cosigned attestation of the selection criteria (avoiding real PII where possible), the protection controls, and access restrictions.

  rationale: |
    Production data copied into test environments is a frequent, avoidable exposure of real sensitive data.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-8-33-test-information-pass.json
      params:
        kind: test_information_protection

  policy:
    engine: rego
    package: concord.iso27001.a_8_33_test_information
    file: ../policies/iso27001-a-8-33-test-information.rego

  remediation:
    runbook: docs/remediation/iso27001-a-8-33-test-information.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.8.33"
    nist_800_53:
      - "SA-15"
      - "SC-28"

  status: stable
  blocking: true
