apiVersion: concord.dev/v1
kind: Control

metadata:
  id: ISO27001-A.5.35-independent-review
  name: iso27001-a-5-35-independent-review
  title: Independent reviews of information security are conducted
  framework: iso27001
  category: Organisational Controls
  severity: medium
  tags:
    - iso27001
  owners:
    - team: security

spec:
  description: |
    ISO/IEC 27001:2022 A.5.35 requires the information security approach to be reviewed independently at planned intervals. Concord verifies a cosigned attestation of the review scope, the reviewer's independence, and how findings are tracked to closure.

  rationale: |
    Independent review is the check against self-graded security; auditors weight it heavily for objectivity.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/iso27001-a-5-35-independent-review-pass.json
      params:
        kind: independent_review

  policy:
    engine: rego
    package: concord.iso27001.a_5_35_independent_review
    file: ../policies/iso27001-a-5-35-independent-review.rego

  remediation:
    runbook: docs/remediation/iso27001-a-5-35-independent-review.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    iso27001:
      - "A.5.35"
    nist_800_53:
      - "CA-2"
      - "PM-14"

  status: stable
  blocking: true
